---
# Hosts and IPs reflect the environment this repo runs against. Swap these for
# your own values if you fork the repo. The group names (vault_hosts,
# vault_consumers) are referenced by the playbooks in playbooks/ and should not
# be renamed.
all:
  children:
    vault_hosts:
      hosts:
        vault-primary:
          ansible_host: 192.168.12.205
          ct_id: 205
          vault_role: primary
        vault-unsealer:
          ansible_host: 192.168.12.206
          ct_id: 206
          vault_role: unsealer
    vault_consumers:
      hosts:
        homeserver:
          ansible_host: 192.168.12.100
          ansible_user: root
